<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>bugzia 便签</title>
<link rel="stylesheet" href="/assets/styleform.css">
<link rel="stylesheet" href="/assets/note.css">
</head>
<body>
<div class="note-root" id="root">
  <div class="note-header" id="header">
    <span class="note-grip" aria-hidden="true"></span>
    <span class="note-title" id="note-title"></span>
    <input type="text" id="title-input" class="note-title-input" maxlength="30" spellcheck="false" hidden>
    <div class="note-actions">
      <button type="button" id="btn-fix" class="note-btn pin" title="钉住（不被其他便签挤开）">钉住</button>
      <button type="button" id="btn-copy" class="note-btn copy" title="复制内容">复制</button>
      <button type="button" id="btn-more" class="note-btn" title="更多操作">更多</button>
      <div class="note-moremenu" id="moremenu" hidden>
        <button type="button" id="btn-pin" class="note-btn pin" title="置顶（保持在最上层）">置顶</button>
        <button type="button" id="btn-style" class="note-btn" title="便签样式">设置</button>
        <button type="button" id="btn-destroy" class="note-btn destroy" title="销毁便笺">销毁</button>
      </div>
    </div>
  </div>
  <div class="note-body" id="body">
    <div class="note-text" id="text"></div>
  </div>
  <div class="note-confirm" id="confirm" tabindex="-1" hidden>
    <div class="note-confirm-panel">
      <div class="note-confirm-title">真的要删除吗？</div>
      <div class="note-confirm-actions">
        <button type="button" id="confirm-yes" class="note-confirm-btn yes" data-note-confirm="yes">Y</button>
        <button type="button" id="confirm-no" class="note-confirm-btn no" data-note-confirm="no">N</button>
      </div>
    </div>
  </div>
  <div class="note-stylepanel" id="stylepanel" hidden>
    <div class="note-stylepanel-card">
      <div class="note-stylepanel-head">
        <button type="button" id="btn-stylelock" class="note-btn lock" title="锁定：样式独立，可单独修改">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path id="lock-path" d="" fill="currentColor"/>
          </svg>
          <span id="lock-label">跟随全局</span>
        </button>
        <button type="button" id="btn-styleclose" class="note-btn" title="关闭样式面板">关闭</button>
      </div>
      <div class="note-stylepanel-form">
        <div class="row">
          <span class="swatches" id="swatches"></span>
        </div>
        <div class="row">
          <label>背景色 <input id="bg-color" type="color"></label>
          <label>不透明度 <input id="bg-a" type="number" step="0.05" min="0.05" max="1"></label>
        </div>
        <div class="row">
          <label>圆角 <input id="radius" type="number" min="0" max="64"></label>
          <label>字号 <input id="font" type="number" min="6" max="64"></label>
        </div>
        <div class="row" id="md-row">
          <label>MD 渲染 <input id="md-render" type="checkbox"></label>
        </div>
        <div class="row"><span class="msg" id="sp-msg"></span></div>
      </div>
      <div class="note-catspanel" id="catspanel" hidden>
        <div class="note-cats-title">分类管理</div>
        <div class="note-cat-list" id="cat-list"></div>
        <div class="note-cat-add">
          <input id="cat-new" type="text" maxlength="30" placeholder="新分类名" spellcheck="false">
          <button type="button" id="btn-cat-add" class="note-btn">添加</button>
        </div>
        <div class="row"><span class="msg" id="cat-msg"></span></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/assets/note.js"></script>
</body>
</html>
